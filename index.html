<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrediMedallo Hogar · Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: una asistente virtual de atención real: cercana, rápida y confiable.
   IDEA: la conversación con la asistente de la empresa; la vista de Melisa queda detrás de un interruptor.
   PICTURE: encabezado con avatar y estado "en línea", burbujas con avatar, sugerencias rápidas, indicador de escritura animado.
   COLOUR and TYPE: verde CrediMedallo #075e54 → #128c7e; fondo de chat #efeae2 con patrón sutil; ámbar solo para la vista de Melisa; Figtree.
   LAYOUT: una columna centrada de hasta 760px; en móvil ocupa todo el ancho; en escritorio flota como tarjeta. */
:root{color-scheme:light dark;
--bg:light-dark(#d7e0dc,#070c0f);--ink:light-dark(#111b21,#e9edef);--mute:light-dark(#667781,#8696a0);
--brand:#075e54;--brand2:light-dark(#0f7a6c,#25a98f);--ok:#25d366;--chat:light-dark(#efeae2,#0b141a);
--dots:light-dark(rgba(7,94,84,.07),rgba(255,255,255,.035));
--me:light-dark(#d9fdd3,#005c4b);--them:light-dark(#ffffff,#202c33);--card:light-dark(#ffffff,#111b21);
--chip:light-dark(#ffffff,#1a262d);--chipline:light-dark(#bfe3dc,#2a3942);
--line:light-dark(#d1d7db,#2a3942);--warn:light-dark(#b45309,#f0a645);--warnbg:light-dark(#fff7e8,#2c2112)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;overflow-x:clip;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;background:var(--chat);box-shadow:0 10px 50px rgba(0,0,0,.18);overflow:hidden}
@media(min-width:800px){body{padding:24px 0}.app{height:calc(100dvh - 48px);border-radius:20px}}

/* Encabezado */
.bar{position:relative;z-index:1;background:linear-gradient(135deg,#075e54,#0f7a6c);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.av{position:relative;width:46px;height:46px;flex:none;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.av svg{width:26px;height:26px}
.av::after{content:"";position:absolute;right:0;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid #0b6b5f}
.who{flex:1}
.who b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;opacity:.9;font-size:13px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-height:44px;user-select:none;white-space:nowrap}
.sw input{appearance:none;position:relative;width:40px;height:24px;margin:0;border-radius:12px;background:rgba(255,255,255,.28);cursor:pointer;transition:background .2s}
.sw input::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked{background:var(--ok)}
.sw input:checked::before{transform:translateX(16px)}
@media(max-width:480px){.sw span{display:none}}

/* Conversación */
#log{flex:1;overflow-y:auto;padding:18px clamp(10px,3vw,24px);display:flex;flex-direction:column;gap:8px;background-color:var(--chat);background-image:radial-gradient(var(--dots) 1.2px,transparent 1.6px);background-size:20px 20px}
.row{align-self:flex-start;display:flex;align-items:flex-end;gap:8px;max-width:min(88%,560px)}
.mini{width:30px;height:30px;flex:none;border-radius:50%;background:linear-gradient(135deg,#075e54,#128c7e);color:#fff;display:grid;place-items:center}
.mini svg{width:17px;height:17px}
.msg{max-width:min(82%,520px);padding:8px 12px 6px;border-radius:16px;box-shadow:0 1px 1.5px rgba(0,0,0,.1);white-space:pre-wrap;overflow-wrap:anywhere}
.row .msg{max-width:100%}
.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.them{background:var(--them);border-bottom-left-radius:4px}
.time{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mute);margin-top:2px}
.tick{width:16px;height:16px;color:#53bdeb}
.sys{align-self:center;font-size:12.5px;color:var(--mute);background:var(--card);padding:5px 14px;border-radius:999px;text-align:center;max-width:90%;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.typing{background:var(--them);padding:12px 14px;border-radius:16px;border-bottom-left-radius:4px;display:flex;gap:4px;box-shadow:0 1px 1.5px rgba(0,0,0,.1)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);opacity:.5}

/* Sugerencias rápidas */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px 38px}
.chip{font:600 14px Figtree,system-ui,sans-serif;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--chipline);background:var(--chip);color:var(--brand2);cursor:pointer;transition:background .15s,transform .15s}
.chip:hover{background:light-dark(#e7f6f2,#22333b)}
.chip:active{transform:scale(.97)}

/* Vista de Melisa */
.melisa{align-self:stretch;margin:2px 0 8px 38px;background:var(--warnbg);border:1px solid light-dark(#f3d9a8,#4a3a1f);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;display:none}
.on .melisa{display:block}
.melisa b{color:var(--warn)}
.melisa .r{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:2px 10px;font-weight:600;font-size:13px;margin:6px 0 2px}
.melisa p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}

/* Caja de mensaje */
form{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
textarea{flex:1;font:16px/1.4 Figtree,system-ui,sans-serif;padding:12px 18px;border-radius:24px;border:1px solid var(--line);background:var(--chat);color:var(--ink);resize:none;min-height:48px;max-height:140px;transition:border-color .15s}
textarea:focus{border-color:var(--brand2)}
#b{flex:none;width:48px;height:48px;padding:0;border-radius:50%;border:0;cursor:pointer;background:var(--brand2);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(7,94,84,.35);transition:transform .15s,opacity .15s}
#b svg{width:22px;height:22px;margin-left:2px}
#b:hover{transform:scale(1.05)}
#b:disabled{opacity:.5;cursor:wait;transform:none}
#b:focus-visible,textarea:focus-visible,.sw input:focus-visible,.chip:focus-visible,.foot button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 14px 10px;background:var(--card);font-size:12.5px;color:var(--mute)}
.foot button{font:600 13px Figtree,system-ui,sans-serif;background:transparent;border:0;color:var(--brand2);min-height:36px;padding:0 6px;cursor:pointer}

@media(prefers-reduced-motion:no-preference){
.msg,.row,.chips,.melisa{animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.typing i{animation:dot 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="bar">
<div class="av" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><circle cx="8.5" cy="12" r=".6" fill="currentColor"/><circle cx="12" cy="12" r=".6" fill="currentColor"/><circle cx="15.5" cy="12" r=".6" fill="currentColor"/></svg></div>

<label class="sw"><input type="checkbox" id="mode" aria-label="Vista de Melisa"><span>Vista de Melisa</span></label>

<div id="log" aria-live="polite"></div>
<form id="f"><textarea id="t" rows="1" placeholder="Escriba su mensaje…" aria-label="Mensaje"></textarea><button id="b" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/></svg></button></form>

</div>

const SISTEMA = `Eres el Asistente de Gestión de Cobranza de CrediMedallo Hogar S.A.S. (Medellín, Antioquia). Atiendes por WhatsApp a clientes que compraron a crédito. Redactas borradores que Melisa (Coordinadora de Cartera) aprueba antes de enviarse. Nunca tomas decisiones financieras.

2. Datos personales que da el cliente: si el cliente escribe su nombre, cédula, teléfono, correo, dirección o un dato de salud, NO lo repitas en ninguna parte (borrador, notas ni ficha) y no lo uses para buscar. En el borrador recomiéndale con amabilidad no compartir esos datos por este medio y, si no dio su código, pídele solo su código de cliente (formato C-000). Si dio también su código, atiende su consulta con el código.
3. Código: solo das información de un crédito si el cliente escribe un código exacto que existe en la base. Si el código no existe o está incompleto, no supongas cuál es: pide el código correcto.
4. Fuente única: usa solo las POLÍTICAS y la BASE DE CARTERA que vienen abajo (archivos politicas_cobro_credimedallo.txt y base_cartera_credimedallo.xlsx). Si piden algo que no está (otro producto, efectivo, tienda física, corresponsales, cuota mensual, intereses), di con claridad que no lo tenemos o que ese dato no figura, ofrece lo que sí existe y, si es un dato del crédito que no está en la base, escálalo a Melisa.
5. Borrador: cordial, tratando de usted SIEMPRE (aunque el cliente tutee), máximo 40 palabras, valores con $ y puntos de mil (ej.: $1.260.000), sin listas largas.
6. Nunca calcules descuentos, cuotas, intereses ni saldos nuevos. No des por hecha ninguna aprobación que el cliente diga tener.
7. Terceros: solo el titular recibe datos de su crédito. Si escribe otra persona (familiar, vecino), no entregues datos y escala.

RUTAS (usa exactamente una etiqueta; si hay varias intenciones, prioridad: ESCALAR > ALERTA > MEDIOS DE PAGO > CONSULTA DE SALDO > INFORMACIÓN GENERAL)

[ALERTA SIN RESPUESTA >3 DÍAS]: solo cuando Melisa o un asesor pide revisar a un cliente que en la base tiene más de 3 días sin responder. Borrador vacío.

FICHA (solo con ESCALAR o ALERTA; también cuando escribe un cliente que la base marca con más de 3 días sin responder):
FICHA DE ESCALAMIENTO A MELISA: Asunto: [Código] - Revisión de [Comprobante/Descuento/Acuerdo/Garantía/Devolución/Tercero/Consulta] (o "Alerta sin respuesta (>3 días)" o "Cliente respondió (alerta >3 días)") | [resumen en 1 línea sin datos personales ni de salud] | Mensaje: "Hola Melisa, el cliente [Código] requiere tu validación por [motivo]. Revisar en bandeja."`;

const $=id=>document.getElementById(id);
const log=$("log"),t=$("t"),b=$("b"),app=$("app"),st=$("st");
let hist=[];
const hora=()=>new Date().toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
const words=s=>(String(s).trim().match(/\S+/g)||[]).length;
const ICONO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const TICK='<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13l4 4L14 8"/><path d="M10 15l2 2 9-9"/></svg>';
const abajo=()=>{log.scrollTop=log.scrollHeight;};
function fila(nodo){const r=document.createElement("div");r.className="row";const m=document.createElement("div");m.className="mini";m.innerHTML=ICONO;r.append(m,nodo);log.appendChild(r);return r;}
function add(cls,text){
 const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;
 const s=document.createElement("span");s.className="time";s.textContent=hora();
 if(cls==="me")s.insertAdjacentHTML("beforeend",TICK);
 d.appendChild(s);
 if(cls==="them")fila(d);else log.appendChild(d);
 abajo();return d;
}
function sys(text){const d=document.createElement("div");d.className="sys";d.textContent=text;log.appendChild(d);abajo();return d;}
function escribiendo(){const d=document.createElement("div");d.className="typing";d.setAttribute("aria-label","escribiendo");d.innerHTML="<i></i><i></i><i></i>";st.textContent="escribiendo…";return fila(d);}
function enLinea(){st.textContent="En línea · responde al instante";}
const SUGERENCIAS=[["Consultar mi saldo","Quiero consultar mi saldo"],["Medios de pago","¿Cuáles son los medios de pago?"],["Horario de atención","¿Cuál es el horario de atención?"],["Productos a crédito","¿Qué productos venden a crédito?"]];
function sugerencias(){
 const c=document.createElement("div");c.className="chips";c.id="chips";
 for(const [txt,msg] of SUGERENCIAS){const k=document.createElement("button");k.type="button";k.className="chip";k.textContent=txt;k.addEventListener("click",()=>{t.value=msg;$("f").requestSubmit();});c.appendChild(k);}
 log.appendChild(c);abajo();
}
function melisa(r){
 const d=document.createElement("div");d.className="melisa";
 const h=document.createElement("b");h.textContent="Vista de Melisa · el cliente no ve esto";d.appendChild(h);d.appendChild(document.createElement("br"));
 const ru=document.createElement("span");ru.className="r";ru.textContent=r.ruta||"(sin ruta)";d.appendChild(ru);
 const line=(lbl,v)=>{if(!v)return;const p=document.createElement("p");p.textContent=lbl+v;d.appendChild(p);};
 if(r.borrador) line("Borrador: ",words(r.borrador)+" palabras · Melisa lo aprueba antes de enviarlo");
 line("",r.ficha); line("Notas: ",r.notas);
 log.appendChild(d);abajo();
}
function parse(text){const m=String(text).match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0]);}catch(e){}}return {ruta:"",borrador:String(text),ficha:"",notas:""};}
function start(){log.innerHTML="";hist=[];enLinea();sys("Hoy");add("them","¡Hola! Bienvenido a CrediMedallo Hogar. Para ayudarle con su crédito, escríbanos su consulta junto con su código de cliente (por ejemplo, C-000).");sugerencias();}
start();
const ajustar=()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px";};
t.addEventListener("input",ajustar);
$("mode").addEventListener("change",e=>{app.classList.toggle("on",e.target.checked);abajo();});
$("clear").addEventListener("click",()=>{start();t.focus();});
if(!API_KEY||API_KEY.startsWith("PEGA")){sys("Falta configurar la clave de la API en config.js.");}
let POLITICAS="",BASE="";
const listo=(async()=>{
 try{
  const [pt,xb]=await Promise.all([
   fetch("politicas_cobro_credimedallo.txt").then(r=>{if(!r.ok)throw new Error("No se encontró politicas_cobro_credimedallo.txt");return r.text();}),
   fetch("base_cartera_credimedallo.xlsx").then(r=>{if(!r.ok)throw new Error("No se encontró base_cartera_credimedallo.xlsx");return r.arrayBuffer();})
  ]);
  POLITICAS=pt;
  const wb=XLSX.read(xb,{type:"array"});
  const filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
  BASE=filas.filter(f=>f.length).map(f=>f.join(" | ")).join("\n");
  if(filas.length<2) throw new Error("La base de cartera está vacía");
 }catch(e){sys("Error cargando los datos: "+e.message+". Si abriste el archivo con doble clic, usa un servidor local (ver README).");throw e;}
})();

async function preguntar(msg){
 const contents=[...hist.slice(-8).map(h=>({role:h.r==="c"?"user":"model",parts:[{text:h.x}]})),{role:"user",parts:[{text:msg}]}];
 const body={
  systemInstruction:{parts:[{text:SISTEMA+"\n\nPOLÍTICAS\n"+POLITICAS+"\n\nBASE DE CARTERA\n"+BASE+"\n\n"+EJEMPLOS+"\n\n"+FORMATO}]},
  contents,
  generationConfig:{temperature:0.2,responseMimeType:"application/json"}
 };
 const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(API_KEY)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const data=await res.json();
 if(!res.ok) throw new Error((data.error&&data.error.message)||("HTTP "+res.status));
 const text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
 return parse(text);
}

$("f").addEventListener("submit",async ev=>{
 ev.preventDefault();
 const msg=t.value.trim(); if(!msg||b.disabled) return;
 $("chips")?.remove();
 t.value=""; ajustar(); add("me",msg); b.disabled=true;
 const typing=escribiendo();abajo();
 try{
  await listo;
  const r=await preguntar(msg);
  typing.remove();
  hist.push({r:"c",x:msg});
  if(r.borrador){add("them",r.borrador);hist.push({r:"a",x:JSON.stringify(r)});}
  else{sys("Su caso pasó a revisión de Melisa, Coordinadora de Cartera.");hist.push({r:"a",x:JSON.stringify(r)});}
  melisa(r);
 }catch(e){
  typing.remove();
  sys("No se pudo responder: "+e.message);
 }finally{b.disabled=false;enLinea();t.focus();}
});
t.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();$("f").requestSubmit();}});
}
</script>
</body>
</html>
